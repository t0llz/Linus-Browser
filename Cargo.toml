[package]
name = "linus_browser"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = { package = "gtk4", version = "0.11", features = ["v4_12"] }
webkit6 = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3.5"
getrandom = "0.3"

[[bin]]
name = "linus_browser"
path = "main.rs"
